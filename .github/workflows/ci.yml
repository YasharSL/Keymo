name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run all gates
        shell: pwsh
        run: ./check.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Keymo.exe
        shell: pwsh
        run: >
          dotnet publish src/Keymo -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -p:Version=$("${{ github.ref_name }}".TrimStart('v')) -o dist
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Keymo.exe --title "Keymo ${{ github.ref_name }}" --generate-notes
